name: publish

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set release tag from Tauri version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('met-id/src-tauri/tauri.conf.json'))['version'])")
          echo "release_tag=Met-ID-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller grpcio grpcio-tools protobuf rdkit

      - name: Install proto
        working-directory: met-id/src-tauri/src
        run: |
          python -m grpc_tools.protoc -I add_to_db --python_out=. --pyi_out=. --grpc_python_out=. protos/streaming.proto

      - name: Set up Conda for native RDKit
        if: runner.os == 'macOS'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: metid-native
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict

      - name: Install native RDKit and Boost development files
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          set -euo pipefail

          conda install --yes -c conda-forge \
            "rdkit=2024.09.6" \
            "librdkit-dev=2024.09.6" \
            libboost-devel

          echo "CONDA_PREFIX=$CONDA_PREFIX" >> "$GITHUB_ENV"

          test -f "$CONDA_PREFIX/include/rdkit/GraphMol/Atom.h"
          test -f "$CONDA_PREFIX/include/boost/config.hpp"

          python -c "import rdkit; print('RDKit:', rdkit.__version__)"

      - name: Stage RDKit dylibs and configure Tauri bundling
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$CONDA_PREFIX/lib"
          STAGE_DIR="met-id/src-tauri/rdkit-libs"
          mkdir -p "$STAGE_DIR"

          shopt -s nullglob
          libraries=("$SOURCE_DIR"/libRDKit*.dylib)
          if [[ ${#libraries[@]} -eq 0 ]]; then
            echo "No libRDKit*.dylib files found in $SOURCE_DIR"
            exit 1
          fi

          for library in "${libraries[@]}"; do
            # Resolve Homebrew symlinks so the staged dylibs are regular files.
            cp -L "$library" "$STAGE_DIR/$(basename "$library")"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("met-id/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text())

          bundle = config.setdefault("bundle", {})
          macos = bundle.setdefault("macOS", {})

          dylibs = sorted(
              p for p in Path("met-id/src-tauri/rdkit-libs").glob("*.dylib")
          )
          staged_frameworks = [
              f"./rdkit-libs/{path.name}" for path in dylibs
          ]

          # Preserve any frameworks already configured in tauri.conf.json.
          existing = macos.get("frameworks", [])
          macos["frameworks"] = list(dict.fromkeys(existing + staged_frameworks))

          config_path.write_text(json.dumps(config, indent=2) + "\n")
          print("Configured RDKit dylibs:")
          print("\n".join(staged_frameworks))
          PY

      - name: Import Apple certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "${APPLE_CERTIFICATE}" | base64 --decode > apple_certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import apple_certificate.p12 \
            -k build.keychain \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" build.keychain

      - name: Install frontend dependencies
        working-directory: met-id
        run: npm install
      
      - name: Configure C++20 for RDKit (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"

      - name: Check native RDKit environment
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -n "$CONDA_PREFIX"
          test -f "$CONDA_PREFIX/include/rdkit/GraphMol/Atom.h"
          echo "Native RDKit prefix: $CONDA_PREFIX"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Protoc
        run: protoc --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            protobuf-compiler

          pkg-config --modversion glib-2.0 gobject-2.0
      
      - name: Install CCS model dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python -m pip install "torch==2.8.0" \
              --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install "torch==2.8.0"
          fi

          python -m pip install "torch-geometric==2.8.0"

          python -m pip install "pyg_lib==0.6.0" \
            --only-binary=:all: \
            --no-index \
            --find-links "https://data.pyg.org/whl/torch-2.8.0+cpu.html"

          python -c "import torch, pyg_lib; print('Torch:', torch.__version__); print('pyg-lib:', pyg_lib.__version__)"
      
      - name: Build PyInstaller binaries (Linux)
        if: runner.os == 'Linux'
        working-directory: met-id/src-tauri/pyinstaller
        shell: bash
        run: |
          set -euo pipefail
          chmod +x make_linux_executables.sh
          ./make_linux_executables.sh

          for binary in metabolite metabolite_for_db prediction_model; do
            path="dist/${binary}-x86_64-unknown-linux-gnu"
            if [[ ! -f "$path" ]]; then
              echo "Missing required sidecar: $path"
              exit 1
            fi
            chmod +x "$path"
          done
      - name: Build PyInstaller binaries (macOS)
        if: runner.os == 'macOS'
        working-directory: met-id/src-tauri/pyinstaller
        shell: bash
        run: |
          set -euo pipefail
          chmod +x make_macos_executables.sh
          ./make_macos_executables.sh
      - name: Install CCS model dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw "Torch installation failed" }

          python -m pip install "torch-geometric==2.8.0"
          if ($LASTEXITCODE -ne 0) { throw "PyG installation failed" }

          python -m pip install "pyg_lib==0.6.0+pt28cpu" --only-binary=:all: --no-index --find-links "https://data.pyg.org/whl/torch-2.8.0+cpu.html"
          if ($LASTEXITCODE -ne 0) { throw "pyg-lib installation failed" }

          python -c "import torch, pyg_lib; print('Torch:', torch.__version__); print('pyg-lib:', pyg_lib.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Model dependency imports failed" }
      
      - name: Build and verify PyInstaller binaries (Windows)
        if: runner.os == 'Windows'
        working-directory: met-id/src-tauri/pyinstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ./make_executables.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller build failed."
          }

          $binaries = @(
            "metabolite",
            "metabolite_for_db",
            "prediction_model"
          )

          foreach ($binary in $binaries) {
            $path = "dist/${binary}-x86_64-pc-windows-msvc.exe"

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required sidecar: $path"
            }
          }

          Get-ChildItem dist

      - uses: tauri-apps/tauri-action@v0
        timeout-minutes: 60


        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: Met-ID-v__VERSION__
          releaseName: Met-ID v__VERSION__
          releaseBody: See the assets to download this version and install.
          projectPath: ./met-id
          releaseDraft: true
          prerelease: false

      - name: Verify macOS app signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="met-id/src-tauri/target/release/bundle/macos/Met-ID.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.version.outputs.release_tag }}" --draft=false

  build-python-wheel:
    runs-on: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python wheel
        working-directory: met-id/met-id-api
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: metid-python-wheel
          path: python-client/dist/*.whl
          if-no-files-found: error