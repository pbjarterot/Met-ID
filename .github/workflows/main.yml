name: publish

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set release tag from Tauri version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('met-id/src-tauri/tauri.conf.json'))['version'])")
          echo "release_tag=Met-ID-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller grpcio grpcio-tools protobuf rdkit

      - name: Install proto
        working-directory: met-id/src-tauri/src
        run: |
          python -m grpc_tools.protoc -I add_to_db --python_out=. --pyi_out=. --grpc_python_out=. protos/streaming.proto

      - name: Set up Conda for native RDKit
        if: runner.os == 'macOS'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: metid-native
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict

      - name: Install pinned native RDKit
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          set -euo pipefail

          conda install --yes -c conda-forge \
            "rdkit=2024.09.6" \
            "librdkit-dev=2024.09.6"

          echo "CONDA_PREFIX=$CONDA_PREFIX" >> "$GITHUB_ENV"

          if [[ ! -f "$CONDA_PREFIX/include/rdkit/GraphMol/Atom.h" ]]; then
            echo "RDKit C++ headers are missing from $CONDA_PREFIX"
            exit 1
          fi

          python -c "import rdkit; print('RDKit:', rdkit.__version__)"

      - name: Stage RDKit dylibs and configure Tauri bundling
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$CONDA_PREFIX/lib"
          STAGE_DIR="met-id/src-tauri/rdkit-libs"
          mkdir -p "$STAGE_DIR"

          shopt -s nullglob
          libraries=("$SOURCE_DIR"/libRDKit*.dylib)
          if [[ ${#libraries[@]} -eq 0 ]]; then
            echo "No libRDKit*.dylib files found in $SOURCE_DIR"
            exit 1
          fi

          for library in "${libraries[@]}"; do
            # Resolve Homebrew symlinks so the staged dylibs are regular files.
            cp -L "$library" "$STAGE_DIR/$(basename "$library")"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("met-id/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text())

          bundle = config.setdefault("bundle", {})
          macos = bundle.setdefault("macOS", {})

          dylibs = sorted(
              p for p in Path("met-id/src-tauri/rdkit-libs").glob("*.dylib")
          )
          staged_frameworks = [
              f"./rdkit-libs/{path.name}" for path in dylibs
          ]

          # Preserve any frameworks already configured in tauri.conf.json.
          existing = macos.get("frameworks", [])
          macos["frameworks"] = list(dict.fromkeys(existing + staged_frameworks))

          config_path.write_text(json.dumps(config, indent=2) + "\n")
          print("Configured RDKit dylibs:")
          print("\n".join(staged_frameworks))
          PY

      - name: Import Apple certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "${APPLE_CERTIFICATE}" | base64 --decode > apple_certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import apple_certificate.p12 \
            -k build.keychain \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" build.keychain

      - name: Install frontend dependencies
        working-directory: met-id
        run: npm install
      
      - name: Configure C++20 for RDKit (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"

      - name: Check native RDKit environment
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -n "$CONDA_PREFIX"
          test -f "$CONDA_PREFIX/include/rdkit/GraphMol/Atom.h"
          echo "Native RDKit prefix: $CONDA_PREFIX"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: Met-ID-v__VERSION__
          releaseName: Met-ID v__VERSION__
          releaseBody: See the assets to download this version and install.
          projectPath: ./met-id
          releaseDraft: true
          prerelease: false

      - name: Verify macOS app signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="met-id/src-tauri/target/release/bundle/macos/Met-ID.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.version.outputs.release_tag }}" --draft=false

  build-python-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            protobuf-compiler \
            zip

          pkg-config --modversion glib-2.0 gobject-2.0

      - name: Install RDKit and configure C++20 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install rdkit
          echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"
      - name: Build server binary
        run: cargo build --release --manifest-path met-id/src-tauri/Cargo.toml --bin Met-ID

      - name: Copy server into Python package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p python-client/metid_api/bin
          cp met-id/src-tauri/target/release/metid-server \
            python-client/metid_api/bin/metid-server
          chmod +x python-client/metid_api/bin/metid-server

      - name: Copy server into Python package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force python-client/metid_api/bin | Out-Null
          Copy-Item met-id/src-tauri/target/release/metid-server.exe `
            python-client/metid_api/bin/metid-server.exe

      - name: Build wheel
        working-directory: python-client
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: metid-wheel-${{ matrix.os }}
          path: python-client/dist/*.whl
          if-no-files-found: error

  build-r-server-bundles:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            protobuf-compiler \
            zip

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller grpcio grpcio-tools protobuf rdkit

      - name: Install proto
        working-directory: met-id/src-tauri/src
        run: |
          python -m grpc_tools.protoc -I add_to_db --python_out=. --pyi_out=. --grpc_python_out=. protos/streaming.proto

      - name: Build PyInstaller binaries (Windows)
        if: runner.os == 'Windows'
        working-directory: met-id/src-tauri/pyinstaller
        shell: pwsh
        run: ./make_executables.ps1

      - name: Build PyInstaller binaries (Linux)
        if: runner.os == 'Linux'
        working-directory: met-id/src-tauri/pyinstaller
        shell: bash
        run: |
          chmod +x make_linux_executables.sh
          ./make_linux_executables.sh

      - name: Build server binary
        run: cargo build --release --manifest-path met-id/src-tauri/Cargo.toml --bin Met-ID

      - name: Assemble R server bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "r-bundle"
          New-Item -ItemType Directory -Force "$stage/bin" | Out-Null

          Copy-Item `
            "met-id/src-tauri/target/release/metid-server.exe" `
            "$stage/bin/metid-server.exe"

          $sidecar = Get-ChildItem `
            "met-id/src-tauri/pyinstaller/dist" `
            -File |
            Where-Object { $_.Name -like "prediction_model*.exe" } |
            Select-Object -First 1

          if (-not $sidecar) {
            throw "Could not find prediction_model*.exe in pyinstaller/dist"
          }

          Copy-Item $sidecar.FullName "$stage/bin/prediction_model.exe"

          if (Test-Path "met-id/src-tauri/DBs") {
            Copy-Item "met-id/src-tauri/DBs" "$stage/DBs" -Recurse
          }

          New-Item -ItemType Directory -Force "r-bundle-dist" | Out-Null
          Compress-Archive `
            -Path "$stage/*" `
            -DestinationPath "r-bundle-dist/metid-r-bundle-windows.zip" `
            -Force

      - name: Assemble R server bundle (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="r-bundle"
          mkdir -p "$STAGE/bin" r-bundle-dist

          cp met-id/src-tauri/target/release/metid-server "$STAGE/bin/metid-server"
          chmod +x "$STAGE/bin/metid-server"

          SIDECAR="$(find met-id/src-tauri/pyinstaller/dist \
            -maxdepth 1 -type f -name 'prediction_model*' \
            ! -name '*.spec' | head -n 1)"

          if [[ -z "$SIDECAR" ]]; then
            echo "Could not find prediction_model* in pyinstaller/dist"
            exit 1
          fi

          cp "$SIDECAR" "$STAGE/bin/prediction_model"
          chmod +x "$STAGE/bin/prediction_model"

          if [[ -d met-id/src-tauri/DBs ]]; then
            cp -R met-id/src-tauri/DBs "$STAGE/DBs"
          fi

          zip -r r-bundle-dist/metid-r-bundle-linux.zip "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: metid-r-bundle-${{ matrix.os }}
          path: r-bundle-dist/*.zip
          if-no-files-found: error

  publish-r-server-bundles:
    needs:
      - publish-tauri
      - build-r-server-bundles

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: metid-r-bundle-*
          path: release-assets
          merge-multiple: true

      - name: Upload R bundles to the Met-ID release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish-tauri.outputs.release_tag }}
          files: release-assets/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}