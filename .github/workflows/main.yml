name: publish

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest] # [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set release tag from Tauri version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('met-id/src-tauri/tauri.conf.json'))['version'])")
          echo "release_tag=Met-ID-v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Protoc release API access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/protocolbuffers/protobuf/releases/tags/v23.4 \
            --jq '{tag: .tag_name, assets: [.assets[].name]}'
      
      - name: Download bundled database
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p met-id/src-tauri/DBs
          gh release download database-v1 \
            --pattern "db.db" \
            --dir met-id/src-tauri/DBs \
            --clobber
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller grpcio grpcio-tools protobuf rdkit
      - name: Install proto
        working-directory: met-id/src-tauri/src
        run: |
          python -m grpc_tools.protoc -I add_to_db --python_out=. --pyi_out=. --grpc_python_out=. protos/streaming.proto
      - name: Set up Conda for native RDKit
        if: runner.os == 'macOS'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: metid-native
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict

      - name: Install native RDKit and Boost development files
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          conda install --yes -c conda-forge \
            "rdkit=2024.09.6" \
            "librdkit-dev=2024.09.6" \
            libboost-devel
          echo "CONDA_PREFIX=$CONDA_PREFIX" >> "$GITHUB_ENV"
          test -f "$CONDA_PREFIX/include/rdkit/GraphMol/Atom.h"
          test -f "$CONDA_PREFIX/include/boost/config.hpp"
          python -c "import rdkit; print('RDKit:', rdkit.__version__)"
      
      
      - name: Stage native macOS libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from collections import deque
          from pathlib import Path

          source = Path(os.environ["CONDA_PREFIX"]) / "lib"
          stage = Path("met-id/src-tauri/rdkit-libs")
          stage.mkdir(parents=True, exist_ok=True)

          # Remove files from previous staging runs
          for file in stage.glob("*.dylib"):
              file.unlink()

          # Start with RDKit and Boost
          initial = sorted(source.glob("libRDKit*.dylib"))
          initial += sorted(source.glob("libboost_*.dylib"))

          if not initial:
              raise RuntimeError("No RDKit or Boost libraries found")

          queue = deque(initial)
          processed = set()
          missing = set()

          while queue:
              library = queue.popleft()
              name = library.name

              if name in processed:
                  continue

              if not library.exists():
                  missing.add(name)
                  continue

              processed.add(name)

              # Resolve symlinks and copy actual library
              shutil.copy2(library.resolve(), stage / name)
              print(f"Bundled: {name}")

              output = subprocess.check_output(
                  ["otool", "-L", str(library)],
                  text=True
              )

              for line in output.splitlines()[1:]:
                  dep = line.strip().split(" (")[0]

                  # macOS-provided absolute paths
                  if dep.startswith(("/usr/lib/", "/System/Library/")):
                      continue

                  # Resolve Conda libraries
                  if dep.startswith("@rpath/"):
                      dep_name = dep.split("/")[-1]
                      dep_path = source / dep_name

                  elif dep.startswith(str(source) + "/"):
                      dep_name = Path(dep).name
                      dep_path = Path(dep)

                  elif dep.startswith("@loader_path/"):
                      dep_name = Path(dep).name
                      dep_path = library.parent / dep.split(
                          "@loader_path/", 1
                      )[1]

                  else:
                      # Other dependency paths need separate inspection
                      if dep.startswith("@") or dep.startswith("/"):
                          raise RuntimeError(
                              f"Unsupported dependency: {name} -> {dep}"
                          )
                      continue

                  if dep_path.exists():
                      if dep_name not in processed:
                          queue.append(dep_path)
                  elif Path("/usr/lib", dep_name).exists():
                      # System fallback must be verified separately
                      print(f"System fallback: {dep_name}")
                  else:
                      missing.add(dep_name)

          if missing:
              raise RuntimeError(
                  "Unresolved dependencies: " + ", ".join(sorted(missing))
              )

          # Verify Boost Serialization
          if not (stage / "libboost_serialization.dylib").exists():
              raise RuntimeError("Boost Serialization is missing")

          # Update Tauri configuration
          config_path = Path("met-id/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text())

          macos = config.setdefault("bundle", {}).setdefault("macOS", {})

          existing = [
              p for p in macos.get("frameworks", [])
              if not p.startswith("./rdkit-libs/")
          ]

          frameworks = [
              f"./rdkit-libs/{p.name}"
              for p in sorted(stage.glob("*.dylib"))
          ]

          macos["frameworks"] = list(
              dict.fromkeys(existing + frameworks)
          )

          config_path.write_text(
              json.dumps(config, indent=2) + "\n"
          )

          print(f"\nStaged {len(frameworks)} libraries")
          PY

      - name: Install frontend dependencies
        working-directory: met-id
        run: npm install
      
      - name: Configure C++20 for RDKit (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"
      - name: Check native RDKit environment
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -n "$CONDA_PREFIX"
          test -f "$CONDA_PREFIX/include/rdkit/GraphMol/Atom.h"
          echo "Native RDKit prefix: $CONDA_PREFIX"
      - name: Install Protoc (macOS)
        if: runner.os == 'macOS'
        uses: arduino/setup-protoc@v3
        with:
          version: "23.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $destination = Join-Path $env:RUNNER_TEMP "protoc"
          Invoke-WebRequest `
            -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v23.4/protoc-23.4-win64.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $bin = Join-Path $destination "bin"
          $protoc = Join-Path $bin "protoc.exe"
          if (-not (Test-Path -LiteralPath $protoc)) {
            throw "protoc.exe was not extracted"
          }
          $bin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "PROTOC=$protoc" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash 
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            protobuf-compiler
          pkg-config --modversion glib-2.0 gobject-2.0
      - name: Verify Protoc
        run: protoc --version
      - name: Install prediction dependencies
        run: python -m pip install pandas
      
      - name: Install CCS model dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python -m pip install "torch==2.8.0" \
              --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install "torch==2.8.0"
          fi
          python -m pip install "torch-geometric==2.8.0"
          python -m pip install "pyg_lib==0.6.0" \
            --only-binary=:all: \
            --no-index \
            --find-links "https://data.pyg.org/whl/torch-2.8.0+cpu.html"
          python -c "import torch, pyg_lib; print('Torch:', torch.__version__); print('pyg-lib:', pyg_lib.__version__)"
      
      - name: Build PyInstaller binaries (Linux)
        if: runner.os == 'Linux'
        working-directory: met-id/src-tauri/pyinstaller
        shell: bash
        run: |
          set -euo pipefail
          chmod +x make_linux_executables.sh
          ./make_linux_executables.sh
          for binary in metabolite metabolite_for_db prediction_model; do
            path="dist/${binary}-x86_64-unknown-linux-gnu"
            if [[ ! -f "$path" ]]; then
              echo "Missing required sidecar: $path"
              exit 1
            fi
            chmod +x "$path"
          done
      - name: Build PyInstaller binaries (macOS)
        if: runner.os == 'macOS'
        working-directory: met-id/src-tauri/pyinstaller
        shell: bash
        run: |
          set -euo pipefail
          chmod +x make_macos_executables.sh
          ./make_macos_executables.sh
      - name: Install CCS model dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw "Torch installation failed" }
          python -m pip install "torch-geometric==2.8.0"
          if ($LASTEXITCODE -ne 0) { throw "PyG installation failed" }
          python -m pip install "pyg_lib==0.6.0+pt28cpu" --only-binary=:all: --no-index --find-links "https://data.pyg.org/whl/torch-2.8.0+cpu.html"
          if ($LASTEXITCODE -ne 0) { throw "pyg-lib installation failed" }
          python -c "import torch, pyg_lib; print('Torch:', torch.__version__); print('pyg-lib:', pyg_lib.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Model dependency imports failed" }
      
      - name: Build and verify PyInstaller binaries (Windows)
        if: runner.os == 'Windows'
        working-directory: met-id/src-tauri/pyinstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./make_executables.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller build failed."
          }
          $binaries = @(
            "metabolite",
            "metabolite_for_db",
            "prediction_model"
          )
          foreach ($binary in $binaries) {
            $path = "dist/${binary}-x86_64-pc-windows-msvc.exe"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required sidecar: $path"
            }
          }
          Get-ChildItem dist
      
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        
      - name: Sign PyInstaller binaries for notarization
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          DIST="met-id/src-tauri/pyinstaller/dist"

          for binary in \
            metabolite-aarch64-apple-darwin \
            metabolite_for_db-aarch64-apple-darwin \
            prediction_model-aarch64-apple-darwin
          do
            codesign --force --timestamp --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY" "$DIST/$binary"
            codesign --verify --strict --verbose=2 "$DIST/$binary"
          done
          
      - uses: tauri-apps/tauri-action@v0
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        #  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --verbose
          tagName: Met-ID-v__VERSION__
          releaseName: Met-ID v__VERSION__
          releaseBody: See the assets to download this version and install.
          projectPath: ./met-id
          releaseDraft: true
          prerelease: false

      
      - name: Verify macOS application and libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="met-id/src-tauri/target/release/bundle/macos/Met-ID.app"
          FRAMEWORKS="$APP_PATH/Contents/Frameworks"
          EXECUTABLE="$APP_PATH/Contents/MacOS/Met-ID"

          echo "Checking application bundle..."

          test -f "$EXECUTABLE"
          test -d "$FRAMEWORKS"

          echo "Checking critical libraries..."

          for library in \
            libboost_serialization.dylib \
            libRDKitGraphMol.1.dylib \
            libRDKitSmilesParse.1.dylib
          do
            if [[ ! -f "$FRAMEWORKS/$library" ]]; then
              echo "ERROR: Missing $library"
              exit 1
            fi

            echo "Found $library"
          done

          echo "Checking executable dependencies..."
          otool -L "$EXECUTABLE"

          echo "Checking bundled library references..."

          python3 - "$APP_PATH" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          frameworks = app / "Contents/Frameworks"
          executable = app / "Contents/MacOS/Met-ID"

          binaries = [executable]
          binaries.extend(frameworks.glob("*.dylib"))

          missing = set()
          system_candidates = set()

          # Libraries commonly provided by macOS.
          # Their actual runtime resolution must still be verified.
          known_system = {
              "libc++.1.dylib",
              "libiconv.2.dylib",
              "libz.1.dylib",
              "libbz2.dylib",
          }

          for binary in binaries:
              result = subprocess.check_output(
                  ["otool", "-L", str(binary)],
                  text=True
              )

              for line in result.splitlines()[1:]:
                  dependency = line.strip().split(" (")[0]

                  if dependency.startswith("@rpath/"):
                      name = dependency.split("/")[-1]

                      if (frameworks / name).exists():
                          continue

                      if name in known_system:
                          system_candidates.add(name)
                      else:
                          missing.add((binary.name, dependency))

                  elif dependency.startswith("/"):
                      if not Path(dependency).exists():
                          missing.add((binary.name, dependency))

          if system_candidates:
              print("\nPotential macOS system libraries:")
              for name in sorted(system_candidates):
                  print(f"  {name}")

          if missing:
              print("\nERROR: Missing dependencies:")
              for binary, dependency in sorted(missing):
                  print(f"  {binary}: {dependency}")
              sys.exit(1)

          print("\nBundled dependency name checks passed")
          PY

          echo "Checking code signature..."

          codesign --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP_PATH"

          echo "macOS application verification passed!"

  build-python-wheel:
    needs: publish-tauri
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python wheel
        working-directory: met-id/metid_api
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: metid-python-wheel
          path: met-id/metid_api/dist/*.whl
          if-no-files-found: error

  publish-release:
    needs: [publish-tauri, build-python-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Python wheel
        uses: actions/download-artifact@v4
        with:
          name: metid-python-wheel
          path: wheel-dist

      - name: Upload wheel to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: Met-ID-v2.0.0 # ${{ needs.publish-tauri.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" wheel-dist/*.whl --clobber

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish-tauri.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
