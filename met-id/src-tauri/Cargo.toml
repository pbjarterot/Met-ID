[package]
name = "Met-ID"
version = "0.5.8"
description = "A Tauri App"
authors = ["you"]
license = "CC BY-NC"
repository = ""
edition = "2021"

[lib]
name="app_lib"
crate-type= ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
tonic-prost-build = "0.14.6"
protoc-grpcio = "3.0"

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
axum = {version = "0.8.9", features = ["tokio", "http1", "http2"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin = "2.7.1"
serde_json = "1.0.151"
csv = "1.4.0"
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] } # DO NOT REMOVE, IF REMOVED BREAKS RUSQLITE
rusqlite = "0.40.2"
lazy_static = "1.5.1"
r2d2 = "0.8.9"
r2d2_sqlite = "0.35.0"
thiserror = "2.0.21"
maplit = "1.0"
ndarray = "0.17.2"
argmin = "0.11.0"
# pyo3 = {version= "0.19", features= ["extension-module"] }
byteorder = "1.4.3"
#chemcore = "0.4"
rayon = "1.12.0"
log = "0.4.34"
dirs = "7.0.0"
once_cell = "1.21.4"
regex = "1.13.1"
nlopt = "0.8.1"
imzml = "0.1.3"
flate2 = "1.1.10"
base64 = "0.23.1"
fuzzy-matcher = "0.3"
tauri-plugin-shell = "2.4.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
protobuf = "4.36.2-release"
prost = "0.14.4"
uuid = "1.27.0"
rand = "0.10.3"
ordered-float = "5.5.0"
tonic-prost = "0.14.6"

# rdkit = { path = "C:/Users/patbj751/Documents/GitHub/rdkit-rust-fork" }

[target.'cfg(target_os="macos")'.dependencies]
rdkit = "0.4.11"


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13.2"


[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
