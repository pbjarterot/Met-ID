[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metid-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "platformdirs",
    "psutil",
    "toml"
]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
metid_api = ["bin/*"]