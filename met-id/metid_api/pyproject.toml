[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metid-api"
version = "0.1.1"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "platformdirs",
    "psutil",
    "toml",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["metid_api*"]
namespaces = false